name: Build OpenSK for Nordic Dongle

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
          override: true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          # 锁死 tockloader==1.5.0 解决致命的兼容性冲突
          pip3 install cryptography ecdsa kconfiglib fido2 pycryptodome intelhex six tockloader==1.5.0

      - name: Build OpenSK DFU Package
        run: |
          # 1. 环境补丁初始化
          ./setup.sh
          
          # 2. 补齐关键工具路径
          export PATH=$PATH:$(pwd)/elf2tab/bin
          
          # 3. 使用验证过的 board 名称和参数
          # 这样生成的 ZIP 会自动避开板子上那块“写保护”的红色区域
          python3 deploy.py --board nrf52840_dongle_dfu --opensk --programmer nordicdfu

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-Final-Package
          path: |
            deploy/*.hex
            deploy/*.zip
