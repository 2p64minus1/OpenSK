name: Build OpenSK for Nordic Dongle

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
          override: true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install cryptography ecdsa kconfiglib tockloader fido2 pycryptodome intelhex six

      - name: Build OpenSK DFU Package
        run: |
          # 1. 环境初始化
          ./setup.sh
          
          # 2. 补全工具路径
          export PATH=$PATH:$(pwd)/elf2tab/bin
          
          # 3. 删掉了报错的 --no-unlock，并确认使用 opensk 模式
          python3 deploy.py --board nrf52840_dongle_dfu --opensk --programmer nordicdfu

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-Final-Package
          path: |
            deploy/*.hex
            deploy/*.zip
