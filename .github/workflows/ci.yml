name: Build OpenSK for Nordic Dongle

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
          override: true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install cryptography ecdsa kconfiglib

      - name: Build OpenSK DFU Package
        run: |
          # 核心修正：指定 --programmer nordicdfu 适配官方蓝色板子
          # 这会自动处理地址偏移，避免冲突
          python3 deploy.py --board nrf52840_dongle_opensk --opensk --programmer nordicdfu --no-unlock

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-Nordic-DFU-Package
          path: |
            deploy/nrf52840_dongle_opensk_dfu.zip
            deploy/nrf52840_dongle_opensk.hex
