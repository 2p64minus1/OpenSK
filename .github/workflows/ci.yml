name: Build OpenSK for Nordic Dongle

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust (Nightly + Source)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-08-01
          target: thumbv7em-none-eabihf
          override: true
          components: rust-src

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install cryptography ecdsa kconfiglib fido2 pycryptodome intelhex six tqdm pyyaml tockloader==1.5.0
          
          curl -L https://github.com/NordicSemiconductor/pc-nrfutil/releases/download/v6.1.7/nrfutil-linux -o nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/

      - name: Build OpenSK DFU Package
        run: |
          # 1. 解决 Git 身份问题
          git config --global user.email "bot@example.com"
          git config --global user.name "OpenSK Bot"

          # 2. 初始化环境
          ./setup.sh
          export PATH=$PATH:$(pwd)/elf2tab/bin
          
          # 3. 【核心修正】强制 Cargo 忽略 fallback 错误
          # 同时通过环境变量和自定义编译指令双重锁定，确保 libtock-rs 能编译通过
          export RUSTFLAGS="-A dependency_on_unit_never_type_fallback --cap-lints warn"
          
          # 4. 运行编译
          python3 deploy.py --board nrf52840_dongle_dfu --opensk --programmer nordicdfu

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-Final-Package
          path: |
            deploy/*.hex
            deploy/*.zip
