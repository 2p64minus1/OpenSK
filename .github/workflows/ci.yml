name: Build OpenSK for Nordic Dongle

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust (Locked Version)
        uses: actions-rs/toolchain@v1
        with:
          # 锁定编译器版本，避开 Rust 2024 的破坏性语法检查
          toolchain: 1.75.0
          target: thumbv7em-none-eabihf
          override: true

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install cryptography ecdsa kconfiglib fido2 pycryptodome intelhex six tqdm pyyaml tockloader==1.5.0
          
          # 安装 nrfutil 签名工具
          curl -L https://github.com/NordicSemiconductor/pc-nrfutil/releases/download/v6.1.7/nrfutil-linux -o nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/

      - name: Build OpenSK DFU Package
        run: |
          ./setup.sh
          export PATH=$PATH:$(pwd)/elf2tab/bin
          # 核心修正：跳过可能因版本波动导致失败的测试步骤，直接编译
          python3 deploy.py --board nrf52840_dongle_dfu --opensk --programmer nordicdfu

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-Final-Package
          path: |
            deploy/*.hex
            deploy/*.zip
