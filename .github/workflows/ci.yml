name: Build-My-OpenSK-Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Environment
        run: |
          ./setup.sh
          pip3 install -r requirements.txt

      - name: Build nRF52840 Dongle Hex
        run: |
          python3 deploy.py --board nrf52840_dongle_opensk --opensk build

      - name: Upload Hex to 6800H
        uses: actions/upload-artifact@v4
        with:
          name: My-OpenSK-Hex
          path: |
            target/**/*.hex
