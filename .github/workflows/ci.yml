name: Build OpenSK for Nordic Dongle

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
          override: true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          # 补齐了 tockloader，确保 DFU 打包不会报错
          pip3 install cryptography ecdsa kconfiglib tockloader

      - name: Build OpenSK DFU Package
        run: |
          # 适配官方蓝色板子，自动处理地址偏移
          python3 deploy.py --board nrf52840_dongle_opensk --opensk --programmer nordicdfu --no-unlock

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-Final-Package
          # 这样会把生成的 hex 和 zip 全部带回来
          path: |
            deploy/*.hex
            deploy/*.zip
