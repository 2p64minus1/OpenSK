name: Build OpenSK for Nordic Dongle

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
          override: true

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install cryptography ecdsa kconfiglib tockloader fido2 pycryptodome intelhex six

      - name: Build OpenSK DFU Package
        run: |
          # 关键点 1：执行 setup.sh 确保补丁和路径正确
          ./setup.sh
          # 关键点 2：换成基础板子名 nrf52840_dongle，绕过逻辑匹配
          python3 deploy.py --board nrf52840_dongle --opensk --programmer nordicdfu --no-unlock

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-Final-Package
          path: |
            deploy/*.hex
            deploy/*.zip
