name: Build OpenSK for Nordic Dongle

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenSK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust (Nightly)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2024-08-01
          target: thumbv7em-none-eabihf
          override: true
          components: rust-src

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install cryptography ecdsa kconfiglib fido2 pycryptodome intelhex six tqdm pyyaml tockloader==1.5.0
          curl -L https://github.com/NordicSemiconductor/pc-nrfutil/releases/download/v6.1.7/nrfutil-linux -o nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/

      - name: Build OpenSK DFU Package
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "OpenSK Bot"
          ./setup.sh
          
          # 设置编译环境
          export PATH=$PATH:$(pwd)/elf2tab/bin
          sed -i '1i #![allow(dependency_on_unit_never_type_fallback)]' third_party/libtock-rs/apis/console/src/lib.rs
          export RUSTFLAGS="-Awarnings"
          
          # 使用 --no-program 阻止脚本尝试寻找 USB 硬件
          python3 deploy.py --board=nrf52840_dongle_dfu --opensk --no-program

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenSK-Final-Package
          # 包含 hex 和 zip 固件文件
          path: |
            target/nrf52840_dongle_dfu/*.zip
            target/nrf52840_dongle_dfu/*.hex
            target/nrf52840_dongle_dfu_merged.hex
